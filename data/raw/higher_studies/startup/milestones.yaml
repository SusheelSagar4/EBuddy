- semester_target: 2
  title: Orientation and idea log
  description: Complete the free Startup India Learning Program; keep an idea log
    of at least 10 problems from own campus/branch
- semester_target: 3
  title: Problem validation
  description: At least 20 customer interviews logged for one problem; written go/kill
    decision with evidence
- semester_target: 4
  title: Team agreement and MVP v0
  description: Founder agreement signed by team; MVP v0 or prototype used by at least
    10 target users; 1-page PRD and a clickable wireframe before building
- semester_target: 5
  title: Business model and unit economics
  description: Model canvas v2; spreadsheet with margin, CAC, break-even; at least
    3 willingness-to-pay conversations; bottom-up market size (TAM/SAM/SOM) with stated
    assumptions
- semester_target: 6
  title: Summer pilot (post Sem 6)
  description: At least 8 weeks of pilot with 3 pilot users or 1 paying customer;
    weekly metric log; North Star metric and AARRR funnel defined before the pilot,
    tracked weekly
- semester_target: 7
  title: IP check and incubation application
  description: IP position checked against institute policy; application filed to
    IIT BBS REP or another incubator
- semester_target: 7
  title: Pitch and funding readiness
  description: 10-slide deck, 12-month plan, and 3 pitch rehearsals with external
    feedback
- semester_target: 8
  title: Traction decision
  description: Written continue / pause / job-first decision using traction data,
    runway and placement status
