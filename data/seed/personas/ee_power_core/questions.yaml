author: Design Team
exercises:
- answer_key:
    correct_option: B
    explanation: Total resistance R_eq = 8 + 4 = 12 Ohm. Total current I = V / R_eq
      = 24 / 12 = 2.0 A. Voltage across 8 Ohm resistor is V = I * R = 2.0 * 8 = 16.0
      V.
  difficulty: 2
  est_minutes: 10
  exercise_id: EX_EE_CIRC_001
  kind: mcq
  module_id: null
  options:
    A: 1.5 A, 12 V
    B: 2.0 A, 16 V
    C: 3.0 A, 24 V
    D: 2.0 A, 8 V
  prompt: In a single-loop series DC circuit containing an ideal 24 V DC voltage source,
    an 8 Ohm resistor, and a 4 Ohm resistor in series, what is the electric current
    flowing through the circuit and the voltage drop across the 8 Ohm resistor?
  rubric: Apply Ohm law and KVL to single loop series circuit.
  skill_id: SKILL_CIRCUIT_ANALYSIS
  source_id: DESIGN_TEAM
  status: draft_for_review
- answer_key:
    correct_option: B
    explanation: 'By voltage division: V_L = V_th * (R_L / (R_th + R_L)). Thus 10
      = 15 * (10 / (R_th + 10)) => 10*R_th + 100 = 150 => R_th = 5.0 Ohm.'
  difficulty: 3
  est_minutes: 12
  exercise_id: EX_EE_CIRC_002
  kind: mcq
  module_id: null
  options:
    A: 2.5 Ohm
    B: 5.0 Ohm
    C: 10.0 Ohm
    D: 15.0 Ohm
  prompt: A linear resistive circuit connected between terminals A and B has an open-circuit
    voltage of 15 V. When a 10 Ohm load resistor is connected across terminals A and
    B, the terminal voltage drops to 10 V. What is the Thevenin equivalent resistance
    R_th seen from terminals A and B?
  rubric: Apply Thevenin theorem and voltage division principle.
  skill_id: SKILL_CIRCUIT_ANALYSIS
  source_id: DESIGN_TEAM
  status: draft_for_review
- answer_key:
    correct_option: B
    explanation: For an ideal transformer, V2 / V1 = N2 / N1. Thus V2 = 230 * (200
      / 1000) = 230 * 0.2 = 46.0 V.
  difficulty: 2
  est_minutes: 10
  exercise_id: EX_EE_MACH_001
  kind: mcq
  module_id: null
  options:
    A: 23 V
    B: 46 V
    C: 115 V
    D: 460 V
  prompt: A single-phase ideal step-down transformer has 1000 primary turns and 200
    secondary turns. If the primary winding is supplied with 230 V (rms) at 50 Hz,
    what is the secondary open-circuit voltage?
  rubric: Ideal transformer turns ratio relation.
  skill_id: SKILL_ELECTRIC_MACHINES
  source_id: DESIGN_TEAM
  status: draft_for_review
- answer_key:
    correct_option: B
    explanation: Synchronous speed N_s = (120 * f) / P = (120 * 50) / 4 = 1500 rpm.
      Slip s = (N_s - N_r) / N_s = (1500 - 1440) / 1500 = 60 / 1500 = 0.04 (4.0%).
  difficulty: 3
  est_minutes: 12
  exercise_id: EX_EE_MACH_002
  kind: mcq
  module_id: null
  options:
    A: 0.02 (2%)
    B: 0.04 (4%)
    C: 0.05 (5%)
    D: 0.06 (6%)
  prompt: A 4-pole, 3-phase squirrel-cage induction motor is fed from a 50 Hz three-phase
    supply. If the rotor rotates at a steady-state speed of 1440 rpm, what is the
    operating fractional rotor slip s?
  rubric: Synchronous speed and slip calculation for 3-phase induction machine.
  skill_id: SKILL_ELECTRIC_MACHINES
  source_id: DESIGN_TEAM
  status: draft_for_review
- answer_key:
    correct_option: B
    explanation: In CCM buck operation, V_out = D * V_in. Therefore, D = V_out / V_in
      = 12 / 48 = 0.25 (25%).
  difficulty: 2
  est_minutes: 10
  exercise_id: EX_EE_POW_001
  kind: mcq
  module_id: null
  options:
    A: '0.15'
    B: '0.25'
    C: '0.50'
    D: '0.75'
  prompt: An ideal DC-DC buck converter operates in continuous conduction mode (CCM)
    with an input voltage of 48 V DC. If a steady regulated output voltage of 12 V
    DC is required across the resistive load, what is the required switching duty
    ratio D?
  rubric: Buck converter voltage conversion ratio in continuous conduction mode.
  skill_id: SKILL_POWER_ELECTRONICS
  source_id: DESIGN_TEAM
  status: draft_for_review
- answer_key:
    correct_option: C
    explanation: In a full-wave rectifier, both positive and negative half-cycles
      of the AC input conduct during one full AC period (1/50 s), giving 2 output
      pulses per cycle. Hence the fundamental ripple frequency is 2 * f = 2 * 50 =
      100 Hz.
  difficulty: 3
  est_minutes: 10
  exercise_id: EX_EE_POW_002
  kind: mcq
  module_id: null
  options:
    A: 25 Hz
    B: 50 Hz
    C: 100 Hz
    D: 200 Hz
  prompt: A single-phase full-wave diode bridge rectifier is supplied from a 230 V,
    50 Hz AC mains utility. What is the fundamental ripple frequency of the rectified
    DC output voltage before any filtering capacitor?
  rubric: Harmonic ripple frequency in AC-DC full wave rectification.
  skill_id: SKILL_POWER_ELECTRONICS
  source_id: DESIGN_TEAM
  status: draft_for_review
- answer_key:
    correct_option: B
    explanation: The Laplace transform of e^(-at) u(t) is 1 / (s + a) with ROC Re(s)
      > -a. For a = 3, H(s) = 1 / (s + 3) with ROC Re(s) > -3.
  difficulty: 2
  est_minutes: 10
  exercise_id: EX_EE_SIG_001
  kind: mcq
  module_id: null
  options:
    A: 1 / (s - 3) for Re(s) > 3
    B: 1 / (s + 3) for Re(s) > -3
    C: s / (s + 3) for Re(s) > 0
    D: 3 / (s + 1) for Re(s) > -1
  prompt: A continuous-time linear time-invariant (LTI) system has an impulse response
    h(t) = e^(-3t) u(t). What is the system transfer function H(s) in the Laplace
    domain?
  rubric: Laplace transform of standard causal exponential signal.
  skill_id: SKILL_SIGNALS_SYSTEMS
  source_id: DESIGN_TEAM
  status: draft_for_review
- answer_key:
    correct_option: A
    explanation: V_rms = 100 / sqrt(2), I_rms = 5 / sqrt(2). Phase angle phi = pi/3
      = 60 degrees. Power factor pf = cos(60) = 0.50 lagging (current lags voltage).
      Active power P = V_rms * I_rms * cos(phi) = (100 * 5 / 2) * 0.5 = 250 * 0.5
      = 125 W.
  difficulty: 3
  est_minutes: 15
  exercise_id: EX_EE_CIRC_003
  kind: mcq
  module_id: null
  options:
    A: 125 W, 0.50 lagging
    B: 250 W, 0.50 lagging
    C: 250 W, 0.866 leading
    D: 500 W, 1.0 unity
  prompt: In an AC circuit supplied by v(t) = 100 cos(100*pi*t) V, the resulting current
    is i(t) = 5 cos(100*pi*t - pi/3) A. What are the active power P and the power
    factor (pf) of the load?
  rubric: AC steady-state sinusoidal active power and power factor.
  skill_id: SKILL_CIRCUIT_ANALYSIS
  source_id: DESIGN_TEAM
  status: draft_for_review
- answer_key:
    correct_option: A
    explanation: For a DC motor, E_b = V_t - (I_a * R_a) = 220 - (50 * 0.2) = 220
      - 10 = 210 V.
  difficulty: 4
  est_minutes: 12
  exercise_id: EX_EE_MACH_003
  kind: mcq
  module_id: null
  options:
    A: 210 V
    B: 220 V
    C: 230 V
    D: 200 V
  prompt: A 220 V DC shunt motor has an armature resistance of 0.2 Ohm. When running
    at full load, it draws an armature current of 50 A. What is the induced back EMF
    E_b developed in the armature?
  rubric: DC motor armature voltage equation and back EMF calculation.
  skill_id: SKILL_ELECTRIC_MACHINES
  source_id: DESIGN_TEAM
  status: draft_for_review
- answer_key:
    correct_option: C
    explanation: For an ideal boost converter in CCM, V_out = V_in / (1 - D) = 24
      / (1 - 0.60) = 24 / 0.40 = 60.0 V.
  difficulty: 3
  est_minutes: 10
  exercise_id: EX_EE_POW_003
  kind: mcq
  module_id: null
  options:
    A: 38.4 V
    B: 40.0 V
    C: 60.0 V
    D: 120.0 V
  prompt: An ideal step-up (boost) converter operates in continuous conduction mode
    with a duty ratio D = 0.60. If the input source voltage is 24 V DC, what is the
    ideal steady-state DC output voltage?
  rubric: Boost converter voltage conversion ratio in continuous conduction mode.
  skill_id: SKILL_POWER_ELECTRONICS
  source_id: DESIGN_TEAM
  status: draft_for_review
